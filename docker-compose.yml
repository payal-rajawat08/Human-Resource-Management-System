
services:
  mongodb:
    image: mongo:8.0
    container_name: hrms-mongodb
    volumes:
      - hrms-mongo-data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./server
    container_name: hrms-backend
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: ""
    container_name: hrms-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hrms-mongo-data:

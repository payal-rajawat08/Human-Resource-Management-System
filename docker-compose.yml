services:
  backend:
    build:
      context: ./server
    container_name: hrms-backend
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./client
    container_name: hrms-frontend
    ports:
      - "5173:5173"
    restart: unless-stopped    

  mongodb:
    image: 
        mongo:8.0
    container_name: hrms-mongodb
    ports:
      - "27017:27017"
    volumes:
      - hrms-mongo-data:/data/db
server {
    listen 80;                  # Nginx port 80 par requests listen karta hai
    server_name _;              # Server name placeholder

    root /usr/share/nginx/html; # React ki build files ki location
    index index.html;           # Website ka main HTML page

    # API requests ko Node.js backend par forward karta hai
    location /api/ {
        proxy_pass http://backend:8000/api/; # Backend service aur port
        proxy_http_version 1.1;              # HTTP/1.1 use karta hai
        proxy_set_header Host $host;         # Original host forward karta hai
        proxy_set_header X-Real-IP $remote_addr; # Client ka IP forward karta hai
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Proxy chain ki IP information
    }

    # Socket.IO ki real-time requests backend ko bhejta hai
    location /socket.io/ {
        proxy_pass http://backend:8000/socket.io/; # Socket.IO backend address
        proxy_http_version 1.1;                    # WebSocket ke liye HTTP/1.1
        proxy_set_header Upgrade $http_upgrade;    # WebSocket upgrade request
        proxy_set_header Connection "upgrade";     # Connection upgrade enable karta hai
        proxy_set_header Host $host;               # Original host forward karta hai
    }

    # React ke dashboard aur doosre routes handle karta hai
    location / {
        try_files $uri $uri/ /index.html; # File na mile toh React index.html serve karo
    }
}